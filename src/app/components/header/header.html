<header class="bg-[#0f172a] border-b border-slate-800 text-white px-4 py-3.5 sticky top-0 z-50 shadow-sm">
  <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
    <!-- Brand Title with Logo -->
    <div class="flex items-center gap-3 cursor-pointer" role="button" tabindex="0" (click)="setView('admin')" (keyup.enter)="setView('admin')">
      <app-qeloma-logo size="md" subtitle="10 MV3 Extensions · Lead Architect: Jawad-Ul-Hadi"></app-qeloma-logo>
    </div>

    <!-- Navigation Tabs -->
    <nav class="flex items-center bg-slate-900/90 p-1 rounded-xl border border-slate-800 text-sm font-medium shadow-inner overflow-x-auto max-w-full">
      <button 
        (click)="setView('simulator')"
        [class.bg-indigo-600]="store.activeView() === 'simulator'"
        [class.shadow-sm]="store.activeView() === 'simulator'"
        [class.text-white]="store.activeView() === 'simulator'"
        [class.text-slate-400]="store.activeView() !== 'simulator'"
        class="flex items-center gap-2 px-3.5 py-1.5 rounded-lg transition-all duration-200 hover:text-white cursor-pointer whitespace-nowrap"
        id="nav-btn-simulator">
        <mat-icon class="text-lg">laptop_mac</mat-icon>
        <span>Live Simulator</span>
      </button>

      <button 
        (click)="setView('showcase')"
        [class.bg-indigo-600]="store.activeView() === 'showcase'"
        [class.shadow-sm]="store.activeView() === 'showcase'"
        [class.text-white]="store.activeView() === 'showcase'"
        [class.text-slate-400]="store.activeView() !== 'showcase'"
        class="flex items-center gap-2 px-3.5 py-1.5 rounded-lg transition-all duration-200 hover:text-white cursor-pointer whitespace-nowrap"
        id="nav-btn-showcase">
        <mat-icon class="text-lg text-amber-400">play_circle</mat-icon>
        <span>Feature Showcase</span>
      </button>

      <button 
        (click)="setView('releases')"
        [class.bg-indigo-600]="store.activeView() === 'releases'"
        [class.shadow-sm]="store.activeView() === 'releases'"
        [class.text-white]="store.activeView() === 'releases'"
        [class.text-slate-400]="store.activeView() !== 'releases'"
        class="flex items-center gap-2 px-3.5 py-1.5 rounded-lg transition-all duration-200 hover:text-white cursor-pointer whitespace-nowrap"
        id="nav-btn-releases">
        <mat-icon class="text-lg text-emerald-400">label</mat-icon>
        <span>Release Notes</span>
      </button>

      <button 
        (click)="setView('community')"
        [class.bg-indigo-600]="store.activeView() === 'community'"
        [class.shadow-sm]="store.activeView() === 'community'"
        [class.text-white]="store.activeView() === 'community'"
        [class.text-slate-400]="store.activeView() !== 'community'"
        class="flex items-center gap-2 px-3.5 py-1.5 rounded-lg transition-all duration-200 hover:text-white cursor-pointer whitespace-nowrap"
        id="nav-btn-community">
        <mat-icon class="text-lg text-amber-300">stars</mat-icon>
        <span>Community</span>
      </button>

      <button 
        (click)="setView('admin')"
        [class.bg-indigo-600]="store.activeView() === 'admin'"
        [class.shadow-sm]="store.activeView() === 'admin'"
        [class.text-white]="store.activeView() === 'admin'"
        [class.text-slate-400]="store.activeView() !== 'admin'"
        class="flex items-center gap-2 px-3.5 py-1.5 rounded-lg transition-all duration-200 hover:text-white cursor-pointer whitespace-nowrap"
        id="nav-btn-admin">
        <mat-icon class="text-lg">dashboard</mat-icon>
        <span>Publisher Console</span>
      </button>

      <button 
        (click)="setView('guide')"
        [class.bg-indigo-600]="store.activeView() === 'guide'"
        [class.shadow-sm]="store.activeView() === 'guide'"
        [class.text-white]="store.activeView() === 'guide'"
        [class.text-slate-400]="store.activeView() !== 'guide'"
        class="flex items-center gap-2 px-3.5 py-1.5 rounded-lg transition-all duration-200 hover:text-white cursor-pointer whitespace-nowrap"
        id="nav-btn-guide">
        <mat-icon class="text-lg">menu_book</mat-icon>
        <span>Deployment Guide</span>
      </button>

      <button 
        (click)="setView('checklist')"
        [class.bg-indigo-600]="store.activeView() === 'checklist'"
        [class.shadow-sm]="store.activeView() === 'checklist'"
        [class.text-white]="store.activeView() === 'checklist'"
        [class.text-slate-400]="store.activeView() !== 'checklist'"
        class="flex items-center gap-2 px-3.5 py-1.5 rounded-lg transition-all duration-200 hover:text-white cursor-pointer whitespace-nowrap"
        id="nav-btn-checklist">
        <mat-icon class="text-lg">fact_check</mat-icon>
        <span>Checklist</span>
      </button>

      <button 
        (click)="setView('monorepo')"
        [class.bg-indigo-600]="store.activeView() === 'monorepo'"
        [class.shadow-sm]="store.activeView() === 'monorepo'"
        [class.text-white]="store.activeView() === 'monorepo'"
        [class.text-slate-400]="store.activeView() !== 'monorepo'"
        class="flex items-center gap-2 px-3.5 py-1.5 rounded-lg transition-all duration-200 hover:text-white cursor-pointer whitespace-nowrap"
        id="nav-btn-monorepo">
        <mat-icon class="text-lg">folder_copy</mat-icon>
        <span>Monorepo Architecture</span>
      </button>

      <button 
        (click)="setView('linter')"
        [class.bg-indigo-600]="store.activeView() === 'linter'"
        [class.shadow-sm]="store.activeView() === 'linter'"
        [class.text-white]="store.activeView() === 'linter'"
        [class.text-slate-400]="store.activeView() !== 'linter'"
        class="flex items-center gap-2 px-3.5 py-1.5 rounded-lg transition-all duration-200 hover:text-white cursor-pointer whitespace-nowrap"
        id="nav-btn-linter">
        <mat-icon class="text-lg">verified_user</mat-icon>
        <span>CWS Linter</span>
      </button>

      <button 
        (click)="setView('onboarding')"
        [class.bg-indigo-600]="store.activeView() === 'onboarding'"
        [class.shadow-sm]="store.activeView() === 'onboarding'"
        [class.text-white]="store.activeView() === 'onboarding'"
        [class.text-slate-400]="store.activeView() !== 'onboarding'"
        class="flex items-center gap-2 px-3.5 py-1.5 rounded-lg transition-all duration-200 hover:text-white cursor-pointer whitespace-nowrap"
        id="nav-btn-onboarding">
        <mat-icon class="text-lg">rocket_launch</mat-icon>
        <span>Onboarding Wizard</span>
      </button>

      <button 
        (click)="setView('economics')"
        [class.bg-indigo-600]="store.activeView() === 'economics'"
        [class.shadow-sm]="store.activeView() === 'economics'"
        [class.text-white]="store.activeView() === 'economics'"
        [class.text-slate-400]="store.activeView() !== 'economics'"
        class="flex items-center gap-2 px-3.5 py-1.5 rounded-lg transition-all duration-200 hover:text-white cursor-pointer whitespace-nowrap"
        id="nav-btn-economics">
        <mat-icon class="text-lg">analytics</mat-icon>
        <span>Build Economics</span>
      </button>
    </nav>

    <!-- Right Action Controls (Global Search & Theme Toggle) -->
    <div class="flex items-center gap-2">
      <!-- Search Trigger Button -->
      <button 
        (click)="openSearch()"
        class="px-3 py-1.5 bg-slate-900 hover:bg-slate-800 text-slate-300 hover:text-white rounded-xl text-xs font-medium border border-slate-700/80 flex items-center gap-2 cursor-pointer transition-all shadow-sm group">
        <mat-icon class="text-sm text-indigo-400 group-hover:scale-110 transition-transform">search</mat-icon>
        <span class="hidden sm:inline">Search Suite...</span>
        <span class="px-1.5 py-0.2 rounded bg-slate-800 border border-slate-700 text-[10px] font-mono text-slate-400">
          ⌘K
        </span>
      </button>

      <!-- Persistent Theme Toggle Button -->
      <button 
        (click)="toggleTheme()"
        class="p-2 bg-slate-900 hover:bg-slate-800 text-slate-300 hover:text-white rounded-xl border border-slate-700/80 flex items-center justify-center cursor-pointer transition-all shadow-sm"
        [title]="store.isLightMode() ? 'Switch to Slate Dark Mode' : 'Switch to High Contrast Light Mode'">
        <mat-icon class="text-sm text-amber-400">
          {{ store.isLightMode() ? 'dark_mode' : 'light_mode' }}
        </mat-icon>
      </button>

      <!-- Right Stats Quick Info -->
      <div class="hidden xl:flex items-center gap-3 text-xs text-slate-300 bg-slate-800/80 px-3 py-1.5 rounded-xl border border-slate-700/60 shadow-sm">
        <div class="flex items-center gap-1.5 text-emerald-400 font-medium">
          <mat-icon class="text-sm">payments</mat-icon>
          <span>$5 Fee</span>
        </div>
        <span class="text-slate-600">|</span>
        <div class="flex items-center gap-1.5 text-indigo-300 font-medium">
          <mat-icon class="text-sm">grid_view</mat-icon>
          <span>10 Tools</span>
        </div>
      </div>
    </div>
  </div>
</header>
