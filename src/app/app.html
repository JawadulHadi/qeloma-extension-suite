<div class="min-h-screen bg-[#0b0f19] text-slate-100 font-sans antialiased selection:bg-indigo-600 selection:text-white pb-12">
  <!-- Top Navigation Header -->
  <app-header />

  <!-- Global Modal Search Overlay -->
  <app-global-search />

  <!-- Main View Container -->
  <main class="max-w-7xl mx-auto px-4 py-6">
    @switch (store.activeView()) {
      @case ('simulator') {
        <app-browser-simulator />
      }
      @case ('showcase') {
        <app-feature-showcase />
      }
      @case ('releases') {
        <app-release-notes />
      }
      @case ('community') {
        <app-developer-testimonials />
      }
      @case ('admin') {
        <app-admin-dashboard />
      }
      @case ('guide') {
        <app-deployment-guide />
      }
      @case ('checklist') {
        <app-deployment-checklist />
      }
      @case ('monorepo') {
        <app-monorepo-explorer />
      }
      @case ('linter') {
        <app-cws-linter />
      }
      @case ('economics') {
        <app-build-economics />
      }
      @case ('onboarding') {
        <app-onboarding-wizard />
      }
    }
  </main>
</div>
